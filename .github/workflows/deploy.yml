name: Build & Deploy to IIS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore lpdeBack/lpdeBack.csproj

      - name: Publish
        run: |
          dotnet publish lpdeBack/lpdeBack.csproj -c Release -o publish --no-restore

      - name: Override secrets in appsettings
        shell: pwsh
        env:
          # Passee par l'environnement et non interpolee dans le script : une cle
          # contenant $ ou " casserait sinon le parsing PowerShell, voire y
          # injecterait du code.
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          $appSettings = Get-Content "publish/appsettings.json" | ConvertFrom-Json
          # La cle de signature JWT ne doit jamais venir du depot : quiconque la lit
          # peut forger un jeton Admin sans posseder de compte. Absence de secret =
          # arret du deploiement, plutot qu'une mise en ligne avec la cle publique.
          $jwtKey = $env:JWT_KEY
          if ([string]::IsNullOrWhiteSpace($jwtKey)) {
            Write-Error "Secret JWT_KEY absent. Deploiement interrompu : publier la cle versionnee reviendrait a laisser l'API signer avec une cle connue de tous."
            exit 1
          }
          if ($jwtKey.Length -lt 32) {
            Write-Error "Secret JWT_KEY trop court ($($jwtKey.Length) caracteres). HMAC-SHA256 exige au moins 32 caracteres."
            exit 1
          }
          $appSettings.Jwt.Key = $jwtKey
          $appSettings.ConnectionStrings.DefaultConnection = "${{ secrets.DB_CONNECTION_STRING }}"
          $appSettings.OpenAI.ApiKey = "${{ secrets.OPENAI_API_KEY }}"
          if ($appSettings.Firebase) { $appSettings.Firebase.ServerKey = "${{ secrets.FIREBASE_SERVER_KEY }}" }
          if ($appSettings.FranceTravail) {
            $appSettings.FranceTravail.ClientId = "${{ secrets.FRANCETRAVAIL_CLIENT_ID }}"
            $appSettings.FranceTravail.ClientSecret = "${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}"
          }
          $appSettings | Add-Member -NotePropertyName Adzuna -NotePropertyValue ([pscustomobject]@{ AppId = "${{ secrets.ADZUNA_APP_ID }}"; AppKey = "${{ secrets.ADZUNA_APP_KEY }}"; Country = "fr"; MaxPages = 20 }) -Force
          $appSettings | Add-Member -NotePropertyName Jooble -NotePropertyValue ([pscustomobject]@{ ApiKey = "${{ secrets.JOOBLE_API_KEY }}"; Location = "France"; MaxPages = 10 }) -Force
          $appSettings | ConvertTo-Json -Depth 10 | Set-Content "publish/appsettings.json"

      - name: Deploy to IIS via WebDeploy
        shell: cmd
        run: |
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" ^
            -verb:sync ^
            -source:contentPath="%GITHUB_WORKSPACE%\publish" ^
            -dest:contentPath="${{ secrets.IIS_SITE_NAME }}",computerName="https://${{ secrets.IIS_SERVER_IP }}:8172/msdeploy.axd",userName="${{ secrets.WEBDEPLOY_USERNAME }}",password="${{ secrets.WEBDEPLOY_PASSWORD }}",authType="Basic" ^
            -enableRule:AppOffline ^
            -allowUntrusted
