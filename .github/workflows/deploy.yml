name: Build & Deploy to IIS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore lpdeBack/lpdeBack.csproj

      # Avant de publier, pas apres. Un deploiement qui compile mais dont
      # le filtrage des chemins de fichiers est casse mettrait les CV a
      # nouveau a portee de main : c'est exactement ce que ces tests
      # gardent.
      - name: Tests
        run: dotnet test lpdeBack.Tests/lpdeBack.Tests.csproj -c Release --nologo

      - name: Publish
        run: |
          dotnet publish lpdeBack/lpdeBack.csproj -c Release -o publish --no-restore

      - name: Override secrets in appsettings
        shell: pwsh
        env:
          # Passee par l'environnement et non interpolee dans le script : une cle
          # contenant $ ou " casserait sinon le parsing PowerShell, voire y
          # injecterait du code.
          JWT_KEY: ${{ secrets.JWT_KEY }}
          # Meme raison : un mot de passe de boite aux lettres contient
          # volontiers $ ou " — interpole dans le script, il le casserait.
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          $appSettings = Get-Content "publish/appsettings.json" | ConvertFrom-Json
          # La cle de signature JWT ne doit jamais venir du depot : quiconque la lit
          # peut forger un jeton Admin sans posseder de compte. Absence de secret =
          # arret du deploiement, plutot qu'une mise en ligne avec la cle publique.
          $jwtKey = $env:JWT_KEY
          if ([string]::IsNullOrWhiteSpace($jwtKey)) {
            Write-Error "Secret JWT_KEY absent. Deploiement interrompu : publier la cle versionnee reviendrait a laisser l'API signer avec une cle connue de tous."
            exit 1
          }
          if ($jwtKey.Length -lt 32) {
            Write-Error "Secret JWT_KEY trop court ($($jwtKey.Length) caracteres). HMAC-SHA256 exige au moins 32 caracteres."
            exit 1
          }
          $appSettings.Jwt.Key = $jwtKey
          $appSettings.ConnectionStrings.DefaultConnection = "${{ secrets.DB_CONNECTION_STRING }}"
          # Cle du modele de langage. La section s'appelle « Ai » depuis que le
          # fournisseur est configurable : viser « OpenAI » ne mettait plus la
          # cle nulle part, et l'analyse de CV repondait 503 en production.
          # Passee par l'environnement : une cle Anthropic contient des tirets
          # et un prefixe, et rien ne garantit qu'elle n'aura jamais de $.
          if ($appSettings.Ai) {
            $appSettings.Ai.ApiKey = $env:ANTHROPIC_API_KEY
            if ([string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) {
              Write-Warning "Secret ANTHROPIC_API_KEY absent : l'analyse de CV et la redaction assistee repondront 503."
            }
          }
          if ($appSettings.Firebase) { $appSettings.Firebase.ServerKey = "${{ secrets.FIREBASE_SERVER_KEY }}" }
          if ($appSettings.FranceTravail) {
            $appSettings.FranceTravail.ClientId = "${{ secrets.FRANCETRAVAIL_CLIENT_ID }}"
            $appSettings.FranceTravail.ClientSecret = "${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}"
          }
          # ── Expedition de courriel ──
          # L'hote et l'expediteur vivent dans appsettings : ils ne sont pas
          # secrets et ne changent pas. Seuls le compte et son mot de passe
          # viennent d'ici. Sans eux, l'API demarre quand meme et ecrit les
          # messages au journal plutot que de refuser de servir — un site
          # d'emploi qui ne peut pas envoyer de courriel reste un site
          # d'emploi, contrairement a un site qui ne demarre pas.
          if ($appSettings.Email) {
            $appSettings.Email.User = $env:EMAIL_USER
            $appSettings.Email.Password = $env:EMAIL_PASSWORD
            if ([string]::IsNullOrWhiteSpace($env:EMAIL_USER)) {
              Write-Warning "Secrets EMAIL_USER / EMAIL_PASSWORD absents : « mot de passe oublie » n'aboutira pas, les adresses ne se confirmeront pas, et les alertes de connexion resteront dans le journal du serveur."
            }
          }
          if ($appSettings.LinkedIn) {
            $appSettings.LinkedIn.ClientId = "${{ secrets.LINKEDIN_CLIENT_ID }}"
            $appSettings.LinkedIn.ClientSecret = $env:LINKEDIN_CLIENT_SECRET
          }
          if ($appSettings.Google) { $appSettings.Google.ClientId = "${{ secrets.GOOGLE_CLIENT_ID }}" }
          # ── SMS (second facteur) ──
          # Sans ces trois valeurs, le SMS n'est simplement pas propose aux
          # membres : l'application d'authentification reste offerte, et
          # c'est de toute facon la methode la plus sure.
          # ── Lettre d'information ──
          # Sans cle, les abonnements et les desinscriptions continuent de
          # fonctionner : seules les campagnes restent en attente, sans etre
          # perdues. Une campagne redigee puis effacee faute de configuration
          # serait a reecrire entierement.
          if ($appSettings.Brevo) {
            $appSettings.Brevo.ApiKey = $env:BREVO_API_KEY
            if ([string]::IsNullOrWhiteSpace($env:BREVO_API_KEY)) {
              Write-Warning "Secret BREVO_API_KEY absent : les campagnes de la lettre d'information resteront en attente."
            }
          }
          if ($appSettings.Ovh) {
            $appSettings.Ovh.ApplicationKey = "${{ secrets.OVH_APPLICATION_KEY }}"
            $appSettings.Ovh.ApplicationSecret = $env:OVH_APPLICATION_SECRET
            $appSettings.Ovh.ConsumerKey = $env:OVH_CONSUMER_KEY
            $appSettings.Ovh.SmsService = "${{ secrets.OVH_SMS_SERVICE }}"
            $appSettings.Ovh.Sender = "${{ secrets.OVH_SMS_SENDER }}"
          }
          $appSettings | Add-Member -NotePropertyName Adzuna -NotePropertyValue ([pscustomobject]@{ AppId = "${{ secrets.ADZUNA_APP_ID }}"; AppKey = "${{ secrets.ADZUNA_APP_KEY }}"; Country = "fr"; MaxPages = 20 }) -Force
          $appSettings | Add-Member -NotePropertyName Jooble -NotePropertyValue ([pscustomobject]@{ ApiKey = "${{ secrets.JOOBLE_API_KEY }}"; Location = "France"; MaxPages = 10 }) -Force
          $appSettings | ConvertTo-Json -Depth 10 | Set-Content "publish/appsettings.json"

      - name: Deploy to IIS via WebDeploy
        shell: cmd
        run: |
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" ^
            -verb:sync ^
            -source:contentPath="%GITHUB_WORKSPACE%\publish" ^
            -dest:contentPath="${{ secrets.IIS_SITE_NAME }}",computerName="https://${{ secrets.IIS_SERVER_IP }}:8172/msdeploy.axd",userName="${{ secrets.WEBDEPLOY_USERNAME }}",password="${{ secrets.WEBDEPLOY_PASSWORD }}",authType="Basic" ^
            -enableRule:AppOffline ^
            -allowUntrusted

      # ══════════════════════════════════════════════
      #  Verification apres deploiement
      #
      #  « msdeploy » rendait la main et le workflow passait au vert. Il
      #  ne rendait compte que du transfert des fichiers : jamais de ce
      #  que l'API repondait ensuite. Une chaine de connexion fausse,
      #  une migration qui echoue au demarrage, un pool qui ne redemarre
      #  pas produisaient un deploiement « reussi » et une API morte.
      #
      #  « /api/sante » existait deja et savait repondre. Personne ne
      #  l'appelait.
      # ══════════════════════════════════════════════
      - name: Test de fumee
        shell: pwsh
        run: |
          $api = "https://api.laplateformedelemploi.com/api"

          # Le pool redemarre et les migrations s'appliquent au
          # demarrage : sur une base qui bouge, cela prend du temps. Six
          # essais espaces de quinze secondes couvrent une minute et
          # demie, ce qui est large et reste court en cas d'echec.
          $sain = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "$api/sante" -TimeoutSec 25 -UseBasicParsing
              if ($r.StatusCode -eq 200) {
                Write-Host "OK   Sante ($($r.Content))"
                $sain = $true
                break
              }
            } catch {
              Write-Host ".. API injoignable ($($_.Exception.Message)), essai $i/6"
            }
            Start-Sleep -Seconds 15
          }

          if (-not $sain) {
            Write-Error "ECHEC — l'API ne repond pas 200 sur /api/sante apres deploiement."
            exit 1
          }

          # Une lecture publique qui touche la base : si la chaine de
          # connexion est fausse, « /sante » peut encore repondre alors
          # que rien ne fonctionne.
          try {
            $offres = Invoke-WebRequest -Uri "$api/joboffers?page=1&pageSize=1" -TimeoutSec 25 -UseBasicParsing
            if ($offres.StatusCode -ne 200) {
              Write-Error "ECHEC — la lecture des offres repond $($offres.StatusCode)."
              exit 1
            }
            Write-Host "OK   Lecture des offres"
          } catch {
            Write-Error "ECHEC — la lecture des offres a echoue : $($_.Exception.Message)"
            exit 1
          }

          Write-Host ""
          Write-Host "Deploiement verifie."
